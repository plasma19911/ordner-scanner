name: Build local OCR and extended references
on:
  push:
    branches: [fix/ocr-card-identity]
    paths-ignore: ['vendor/**', 'reference-images/**', 'reference-cache.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:ocr
      - run: npm install --no-save --package-lock=false sharp@0.35.5
      - run: node scripts/cache-references.mjs en:Swellow
      - name: Save browser assets and public references
        env:
          ASSET_BRANCH: ${{ github.ref_name }}
        run: |
          git add vendor reference-images reference-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build pinned local OCR runtime and extended reference cache"
          git push origin "HEAD:$ASSET_BRANCH"
